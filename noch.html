<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проба: живое фото у дома в центре</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
:root { --bg:#EDEFEC; --surface:#fff; --ink:#1D2125; --muted:#5E666C; --wood:#B4672C; --radius:14px; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--bg); color:var(--ink); font-family:"Onest","Segoe UI",Roboto,system-ui,sans-serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
.app { max-width:520px; margin:0 auto; padding:14px 16px 70vh; }
.brand { font-family:"Oswald",sans-serif; font-weight:600; font-size:21px; margin:6px 0 2px; }
.sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
.spacer { height:30vh; }
.card { display:block; width:calc(100% + 32px); margin-inline:-16px; background:var(--surface); border-radius:calc(var(--radius) * var(--r, 1)); overflow:hidden; transform:scale(var(--s, 1)); transform-origin:50% 50%; will-change:transform; }
.card .body { padding:12px 16px 14px; }
.photo { position:relative; aspect-ratio:4/3; background:#222; overflow:hidden; }
.photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transform-origin:50% 55%; }
/* Эффект 1: медленное движение фото, пока дом в центре (класс is-live) */
.photo img.a { transform:scale(var(--z,1)); transition:transform .2s linear; }
.photo.is-live img.a { animation:drift 9s ease-in-out infinite alternate; transition:none; }
@keyframes drift { from { transform:scale(1.04) translate(-1.2%, 0.6%); } to { transform:scale(1.12) translate(1.4%, -1.0%); } }
/* Эффект 2: второй ракурс проявляется через 2,5 с и держится, потом обратно */
.photo img.b { opacity:0; transition:opacity 1.4s ease; }
.photo.is-live img.b { animation:swap 11s ease-in-out infinite; }
.photo.is-live img.b { transform:scale(1.06); animation:swap 11s ease-in-out infinite, drift2 11s ease-in-out infinite; }
@keyframes swap { 0%,22% { opacity:0; } 34%,68% { opacity:1; } 80%,100% { opacity:0; } }
@keyframes drift2 { from { transform:scale(1.04) translate(1%, 0); } to { transform:scale(1.12) translate(-1%, -1%); } }
.badge { position:absolute; left:12px; top:12px; background:rgba(17,20,22,.78); color:#fff; font-size:12px; font-weight:500; padding:4px 9px; border-radius:999px; }
.tag { position:absolute; right:12px; bottom:12px; background:rgba(255,255,255,.85); color:#1D2125; font-size:12px; padding:3px 8px; border-radius:999px; opacity:0; transition:opacity .6s; }
.photo.is-live .tag { opacity:1; }
.name { font-family:"Oswald",sans-serif; font-weight:600; font-size:20px; line-height:1.15; margin:0 0 4px; }
.dim { color:var(--muted); font-size:13px; margin:0 0 6px; }
.lead { margin:0; font-size:15px; }
.hint { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:13px; color:#fff; background:rgba(20,24,30,.85); backdrop-filter:blur(6px); }
</style>
</head>
<body>
<div class="app">
  <h1 class="brand">Проба: живое фото</h1>
  <p class="sub">Останови дом в середине экрана и подожди 3 секунды: фото медленно плывёт, потом показывается второй вид.</p>
  <div class="spacer"></div>
  <div id="list"></div>
</div>
<div class="hint">Страница для просмотра эффекта. Ни из приложения, ни с сайта сюда ссылок нет.</div>
<script>
const HOUSES = [
  {a:"hero-1", b:"p-hero-1", tag:"с другой стороны", badge:"Чёрный фасад", name:"Чёрный снаружи, белый внутри", dim:"6×8,5 м: дом 6×6 м и терраса 2,5×6 м", lead:"Две спальни, кухня-гостиная с печью и терраса под общей крышей."},
  {a:"c2", b:"p-c2", tag:"с другой стороны", badge:"Баня с комнатой", name:"Баня с жилой комнатой", dim:"31,5 м² + терраса 12 м²", lead:"Баня, в которой можно жить: комната 14 м², парная, душевая и санузел."},
  {a:"c8", b:"p-c8", tag:"внутри", badge:"Студия", name:"Дом-студия 27 м²", dim:"27 м²", lead:"Светлая комната с печью, кухня и санузел."},
  {a:"c10", b:"p-c10", tag:"с другой стороны", badge:"Рыжий с графитом", name:"Дом 48 м², рыжий с графитом", dim:"48 м²", lead:"Две спальни и кухня-гостиная с большим окном."},
];
const list = document.getElementById('list');
list.innerHTML = HOUSES.map(h => `
  <div class="card">
    <div class="photo">
      <img class="a" src="img/${h.a}.webp" alt="">
      <img class="b" src="img/${h.b}.webp" alt="">
      <span class="badge">${h.badge}</span>
      <span class="tag">${h.tag}</span>
    </div>
    <div class="body"><h2 class="name">${h.name}</h2><p class="dim">${h.dim}</p><p class="lead">${h.lead}</p></div>
  </div>`).join('');

const cards = [...document.querySelectorAll('.card')];
let raf = 0, liveTimer = 0, liveEl = null;
function update(){
  raf = 0;
  const mid = innerHeight * 0.48, reach = innerHeight * 0.6, flat = 0.08;
  let best = null, bestD = 1e9;
  for (const c of cards){
    const ph = c.querySelector('.photo');
    const r = ph.getBoundingClientRect();
    const off = Math.abs(r.top + r.height / 2 - mid);
    const d = Math.max(0, Math.min(1, off / reach) - flat) / (1 - flat);
    const k = 1 - d, e = k * k * (3 - 2 * k);
    c.style.setProperty('--s', (0.86 + e * 0.14).toFixed(3));
    c.style.setProperty('--r', Math.min(1, (1 - e) / 0.35).toFixed(3));
    ph.style.setProperty('--z', (1 + e * 0.06).toFixed(3));
    if (off < bestD) { bestD = off; best = ph; }
  }
  // «живым» становится дом, который стоит в центре дольше 0,8 с (во время листания эффект не включается)
  if (best !== liveEl || bestD > innerHeight * 0.15) {
    clearTimeout(liveTimer);
    if (liveEl) { liveEl.classList.remove('is-live'); liveEl = null; }
    if (bestD <= innerHeight * 0.15) liveTimer = setTimeout(() => { liveEl = best; best.classList.add('is-live'); }, 800);
  }
}
const queue = () => { if (!raf) raf = requestAnimationFrame(update); };
addEventListener('scroll', queue, {passive:true});
addEventListener('resize', queue);
update();
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проба: день и ночь при пролистывании</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
:root { --bg:#EDEFEC; --surface:#fff; --ink:#1D2125; --muted:#5E666C; --wood:#B4672C; --radius:14px; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--bg); color:var(--ink); font-family:"Onest","Segoe UI",Roboto,system-ui,sans-serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .4s; }
.app { max-width:520px; margin:0 auto; padding:14px 16px 70vh; }
.spacer { height:30vh; }
.brand { font-family:"Oswald",sans-serif; font-weight:600; font-size:21px; margin:6px 0 2px; }
.sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
.card { display:block; width:calc(100% + 32px); margin-inline:-16px; background:var(--surface); border-radius:calc(var(--radius) * var(--r, 1)); overflow:hidden; transform:scale(var(--s, 1)); transform-origin:50% 50%; will-change:transform; }
.card .body { padding-inline:16px; }
.photo { position:relative; aspect-ratio:4/3; background:#0b1020; overflow:hidden; }
.photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transform:scale(var(--z, 1)); transform-origin:50% 55%; will-change:transform; }
.photo img.night { opacity:0; will-change:opacity; }
.badge { position:absolute; left:12px; top:12px; background:var(--wood); color:#fff; font-size:12px; font-weight:600; padding:4px 9px; border-radius:999px; }
.body { padding:12px 14px 14px; }
.name { font-family:"Oswald",sans-serif; font-weight:600; font-size:20px; line-height:1.15; margin:0 0 4px; }
.dim { color:var(--muted); font-size:13px; margin:0 0 6px; }
.lead { margin:0; font-size:15px; }
.hint { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:13px; color:#fff; background:rgba(20,24,30,.85); backdrop-filter:blur(6px); }
</style>
</head>
<body>
<div class="app">
  <h1 class="brand">Проба: день и ночь</h1>
  <p class="sub">Листай вниз и вверх. Дом в середине экрана — крупный и дневной, у края — меньше и ночной.</p>
  <div class="spacer"></div>
  <div id="list"></div>
</div>
<div class="hint">Страница для просмотра эффекта. Ни из приложения, ни с сайта сюда ссылок нет.</div>
<script>
const HOUSES = [
  {p:"h48s-1", badge:"Одна спальня", name:"Дом 48 м² с одной спальней", dim:"48 м²", lead:"Одна спальня и просторная кухня-гостиная. Установлен в марте 2026."},
  {p:"hmb-1", badge:"Минидом + баня", name:"Угловой комплекс «Минидом с баней»", dim:"2 модуля углом · 2 террасы", lead:"Дачный домик с русской парной в Карелии: спальня, кухня, санузел и техпомещение."},
  {p:"hmini-1", badge:"Студия 20 м²", name:"Минидом 20 м²", dim:"20 м² · для 1–2 человек", lead:"Маленький тёплый домик с кухней, спальным местом и санузлом. Можно перевезти на другой участок."},
];
const list = document.getElementById('list');
list.innerHTML = HOUSES.map((h,i) => `
  <div class="card">
    <div class="photo">
      <img class="day" src="img/${h.p}.jpg" alt="">
      <img class="night" src="img/noch-${h.p}.jpg" alt="">
      <span class="badge">${h.badge}</span>
    </div>
    <div class="body"><h2 class="name">${h.name}</h2><p class="dim">${h.dim}</p><p class="lead">${h.lead}</p></div>
  </div>`).join('');

const cards = [...document.querySelectorAll('.card')];
let raf = 0;
function update(){
  raf = 0;
  // как в каталоге: середина чуть выше центра, зона действия 60% высоты экрана
  const mid = innerHeight * 0.48, reach = innerHeight * 0.6, flat = 0.08;
  for (const c of cards){
    const ph = c.querySelector('.photo');
    const r = ph.getBoundingClientRect();
    const d = Math.max(0, Math.min(1, Math.abs(r.top + r.height / 2 - mid) / reach) - flat) / (1 - flat);
    const k = 1 - d, e = k * k * (3 - 2 * k);           // 1 — дом в центре, 0 — у края
    c.style.setProperty('--s', (0.86 + e * 0.14).toFixed(3));   // размер карточки
    c.style.setProperty('--r', Math.min(1, (1 - e) / 0.35).toFixed(3)); // скругление углов
    ph.style.setProperty('--z', (1 + e * 0.06).toFixed(3));     // фото чуть приближается
    ph.querySelector('.night').style.opacity = (1 - e).toFixed(3); // ночь у края
  }
}
const queue = () => { if (!raf) raf = requestAnimationFrame(update); };
addEventListener('scroll', queue, {passive:true});
addEventListener('resize', queue);
update();
</script>
</body>
</html>

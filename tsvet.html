<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проба: каждый дом в своём цвете</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
:root { --ink:#1D2125; --muted:#5E666C; --bg:#EDEFEC; --radius:16px; }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--bg); color:var(--ink); font-family:"Onest","Segoe UI",Roboto,system-ui,sans-serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background-color .7s ease; }
.app { max-width:520px; margin:0 auto; padding:14px 16px 40px; }
.brand { font-family:"Oswald",sans-serif; font-weight:600; font-size:21px; margin:6px 0 2px; }
.sub { color:var(--muted); font-size:13px; margin:0 0 10px; }
.house { min-height:88vh; display:flex; flex-direction:column; justify-content:center; padding:28px 0; }
.name { font-family:"Oswald",sans-serif; font-weight:600; font-size:34px; line-height:1.05; margin:0 0 8px; letter-spacing:-.01em; }
.lead { margin:0 0 6px; font-size:16px; }
.dim { color:var(--muted); font-size:14px; margin:0 0 16px; }
.btn { display:inline-block; align-self:flex-start; background:rgba(29,33,37,.08); color:var(--ink); border-radius:999px; padding:9px 16px; font-size:14px; font-weight:500; margin:0 0 18px; text-decoration:none; }
.frame { position:relative; width:calc(100% + 32px); margin-inline:-16px; aspect-ratio:4/3; border-radius:var(--radius); overflow:hidden; background:#222; }
.frame img { position:absolute; left:0; top:-12%; width:100%; height:124%; object-fit:cover; display:block; transform:translateY(var(--py,0)); will-change:transform; }
.hint { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:13px; color:#fff; background:rgba(20,24,30,.85); backdrop-filter:blur(6px); }
</style>
</head>
<body>
<div class="app">
  <h1 class="brand">Проба: каждый дом в своём цвете</h1>
  <p class="sub">Листай. Фон меняется под дом, фото чуть едет в рамке.</p>
  <div id="list"></div>
</div>
<div class="hint">Страница для просмотра эффекта. Ни из приложения, ни с сайта сюда ссылок нет.</div>
<script>
const HOUSES = [
  {a:"hero-1", bg:"#F3E9DB", name:"Чёрный снаружи, белый внутри", dim:"6×8,5 м: дом 6×6 м и терраса 2,5×6 м", lead:"Две спальни, кухня-гостиная с печью и терраса под общей крышей."},
  {a:"c2",     bg:"#E3EAF0", name:"Дом с террасой под крышей", dim:"31,5 м² + терраса 12 м²", lead:"Комната, спальня, душевая и санузел. Терраса под той же крышей, что и дом."},
  {a:"c8",     bg:"#E4EEE1", name:"Дом-студия 27 м²", dim:"27 м²", lead:"Светлая комната с печью, кухня и санузел."},
];
document.getElementById('list').innerHTML = HOUSES.map(h => `
  <section class="house" data-bg="${h.bg}">
    <h2 class="name">${h.name}</h2>
    <p class="lead">${h.lead}</p>
    <p class="dim">${h.dim}</p>
    <a class="btn" href="#">Подробнее</a>
    <div class="frame"><img src="img/${h.a}.webp" alt=""></div>
  </section>`).join('');

const sections = [...document.querySelectorAll('.house')];
let cur = null, raf = 0;
function update(){
  raf = 0;
  const H = innerHeight, mid = H * 0.5;
  let best = null, bestD = 1e9;
  for (const s of sections){
    const r = s.getBoundingClientRect();
    const d = Math.abs(r.top + r.height / 2 - mid);
    if (d < bestD){ bestD = d; best = s; }
    // фото едет в рамке: пока рамка идёт по экрану снизу вверх, картинка внутри сдвигается на ±12% своей высоты
    const f = s.querySelector('.frame'), fr = f.getBoundingClientRect();
    const t = (fr.top + fr.height / 2 - mid) / H;            // −0.5..0.5
    const py = Math.max(-1, Math.min(1, t * 2)) * 0.09 * fr.height;
    f.querySelector('img').style.setProperty('--py', py.toFixed(1) + 'px');
  }
  if (best !== cur){ cur = best; document.body.style.backgroundColor = best.dataset.bg; }
}
const queue = () => { if (!raf) raf = requestAnimationFrame(update); };
addEventListener('scroll', queue, {passive:true});
addEventListener('resize', queue);
update();
</script>
</body>
</html>

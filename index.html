<style>
/* Макет: одна колонка шириной телефона; карточки домов как листы проекта — фото, название, строка размеров моноширинным шрифтом, как подпись на чертеже */
:root {

  --f-display: "Oswald", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", Roboto, system-ui, sans-serif;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --surface: #1B1F22; --ink: #E7E5E0; --muted: #9AA2A7; --line: #2C3236;

    p.push(`<path d="M${(hx + kk * 4).toFixed(1)} ${hy.toFixed(1)} l${kk * 7} -4 v8 z" fill="#B4672C"/>`);
  }
  // подписи комнат: название, размеры в чистоте, площадь
  lay.rooms.forEach((r, ri) => {
    const q = cl[ri];
    let cx = X((q.x0 + q.x1) / 2), cy = Y((q.y0 + q.y1) / 2);
    const name = ROOM[r.t].n, area = fmt(q.a) + " м²", dims = `${fmt2(q.w)}×${fmt2(q.h)}`;
    const wpx = q.w * s, hpx = q.h * s, need = name.length * 5.6 * k;
    const showDims = ed ? wpx >= dims.length * 6.2 + 4 : wpx >= dims.length * 5.6 + 8 && hpx >= 50;
    const lines = 2 + (showDims ? 1 : 0), bandH = lines * 11 * k;
    // подпись не должна лежать на дуге двери: сдвигаем её в свободную часть комнаты
    const near = (a, b) => Math.abs(a - b) < 0.01;
    for (const d of allDoors) {
      const dl = d.w + 0.05;
      if (d.o === "v" && ((near(d.c, r.x) && d.side > 0) || (near(d.c, r.x + r.w) && d.side < 0)) && d.a < r.y + r.h && d.b > r.y) {
        if (Y(d.a) < cy + bandH / 2 + 4 && Y(d.b) > cy - bandH / 2 - 4) {
          const fa = near(d.c, r.x) ? q.x0 + dl : q.x0, fb = near(d.c, r.x) ? q.x1 : q.x1 - dl;
          if ((fb - fa) * s >= Math.min(need, 76) + 4) cx = X((fa + fb) / 2);
          else {
            const up = d.a - q.y0, dn = q.y1 - d.b;
            if (Math.max(up, dn) * s >= bandH + 4) cy = up >= dn ? Y(q.y0 + up / 2) : Y(d.b + dn / 2);
          }
        }
      } else if (d.o === "h" && ((near(d.c, r.y) && d.side > 0) || (near(d.c, r.y + r.h) && d.side < 0)) && d.a < r.x + r.w && d.b > r.x) {
        if (X(d.a) < cx + need / 2 && X(d.b) > cx - need / 2) {
          const fa = near(d.c, r.y) ? q.y0 + dl : q.y0, fb = near(d.c, r.y) ? q.y1 : q.y1 - dl;
          if ((fb - fa) * s >= bandH + 4) cy = Y((fa + fb) / 2);
        }
      }
    }
    const t1 = (x, y, t, fs, fw, col, fam, extra = "") => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="${(fs * k).toFixed(1)}"${fw ? ` font-weight="${fw}"` : ""} fill="${col}" ${fam} ${extra}>${t}</text>`;
    const sub = showDims ? [[dims, "#4E5458"], [area, "#6A6F73"]] : [[area, "#6A6F73"]];
    if (wpx >= need + 6) {
      let y = cy - (sub.length * 11 * k) / 2 + 3;
      p.push(t1(cx, y, name, 10.5, 600, "#2A2E31", F));
      sub.forEach(([t, col]) => { y += 11.5 * k; p.push(t1(cx, y, t, 9.5, 0, col, M)); });
    } else if (name.includes("-") && wpx >= Math.max(...name.split("-").map((x) => x.length)) * 5.6 * k + 8 && hpx >= (44 + sub.length * 6) * k) {
      const [n1, n2] = name.split("-");
      let y = cy - (sub.length * 11 * k) / 2 - 3;
      p.push(t1(cx, y, n1 + "-", 10.5, 600, "#2A2E31", F)); y += 12 * k;
      p.push(t1(cx, y, n2, 10.5, 600, "#2A2E31", F));
      sub.forEach(([t, col]) => { y += 11.5 * k; p.push(t1(cx, y, t, 9.5, 0, col, M)); });
    } else if (hpx >= need + 4) {
      p.push(t1(cx, cy + 3.5, name, 10, 600, "#2A2E31", F, `transform="rotate(-90 ${cx.toFixed(1)} ${cy.toFixed(1)})"`));
      if (ed && wpx >= 40) p.push(t1(cx + 13 * k, cy + 3.5, `${fmt2(q.w)}×${fmt2(q.h)}`, 8.5, 0, "#4E5458", M, `transform="rotate(-90 ${(cx + 13 * k).toFixed(1)} ${cy.toFixed(1)})"`));
    } else {
      const short = { "Санузел": "С/у", "Прихожая": "Прих.", "Кладовая": "Клад.", "Моечная": "Моеч.", "Хозблок": "Хоз.", "Парная": "Парн." }[name] || name;
      p.push(t1(cx, cy + 3.5, short, 9, 600, "#2A2E31", F));
      if (ed) p.push(t1(cx, cy + 15, fmt2(q.w), 8.5, 0, "#4E5458", M));
    }
  });
  // размеры: в редакторе при перетаскивании — цепочка размеров в чистоте
  const dimLine = (x1, y1, x2, y2, txt, col, vert) => {
    let out = line(x1, y1, x2, y2, col, 0.9);
    if (vert) { out += line(x1 - 3, y1, x1 + 3, y1, col, 0.9) + line(x2 - 3, y2, x2 + 3, y2, col, 0.9); const ty = (y1 + y2) / 2, tx = x1 - 4; out += `<text transform="rotate(-90 ${tx.toFixed(1)} ${ty.toFixed(1)})" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="${(10 * k).toFixed(1)}" font-weight="${ed ? 700 : 400}" fill="${col}" ${M}>${txt}</text>`; }
    else { out += line(x1, y1 - 3, x1, y1 + 3, col, 0.9) + line(x2, y2 - 3, x2, y2 + 3, col, 0.9); out += `<text x="${((x1 + x2) / 2).toFixed(1)}" y="${(y1 - 4).toFixed(1)}" text-anchor="middle" font-size="${(10 * k).toFixed(1)}" font-weight="${ed ? 700 : 400}" fill="${col}" ${M}>${txt}</text>`; }
    return out;
  };
  const dq = ed && opt.drag ? lay.params.find((q) => q.k === opt.drag) : null;
  if (dq) {
    const hd = wallHandle(lay, dq, L, W), col = "#C2621F";
    if (dq.o === "v") {
      const ys = hd.side < 0 ? 0.6 : hd.side > 0 ? W - 0.6 : hd.y;
      const row = lay.rooms.map((r, i) => [r, cl[i]]).filter(([r]) => ys > r.y && ys < r.y + r.h).sort((a, b) => a[0].x - b[0].x);
      for (const [, q] of row) p.push(dimLine(X(q.x0), oy - 34, X(q.x1), oy - 34, fmt2(q.w), col, false));
      for (const [a, b] of hd.iv) p.push(rect(X(lay.p[dq.k]) - 3, Y(a), 6, (b - a) * s, "#E07A2E", 'opacity=".35"'));
    } else {
      const xs = hd.side < 0 ? 0.6 : hd.side > 0 ? L - 0.6 : hd.x;
      const colR = lay.rooms.map((r, i) => [r, cl[i]]).filter(([r]) => xs > r.x && xs < r.x + r.w).sort((a, b) => a[0].y - b[0].y);
      const cx = hd.side < 0 ? ox + L * s + 30 : ox - 30;
      for (const [, q] of colR) p.push(dimLine(cx, Y(q.y0), cx, Y(q.y1), fmt2(q.h), col, true));
      for (const [a, b] of hd.iv) p.push(rect(X(a), Y(lay.p[dq.k]) - 3, (b - a) * s, 6, "#E07A2E", 'opacity=".35"'));
    }
  } else if (!ed) {
    const dy = oy - 10;
    p.push(dimLine(ox, dy, ox + L * s, dy, `${fmt(L)} м`, "#8A8F92", false));
    const dx = tLeft ? ox + L * s + 10 : ox - 10;
    if (tLeft) {
      p.push(line(dx, oy, dx, oy + W * s, "#8A8F92", 0.8) + line(dx - 3, oy, dx + 3, oy, "#8A8F92", 0.8) + line(dx - 3, oy + W * s, dx + 3, oy + W * s, "#8A8F92", 0.8));
      p.push(`<text transform="rotate(-90 ${(dx + 11).toFixed(1)} ${(oy + W * s / 2).toFixed(1)})" x="${(dx + 11).toFixed(1)}" y="${(oy + W * s / 2).toFixed(1)}" text-anchor="middle" font-size="10" fill="#5E666C" ${M}>${fmt(W)} м</text>`);
    } else p.push(dimLine(dx, oy, dx, oy + W * s, `${fmt(W)} м`, "#8A8F92", true));
  } else {
    p.push(`<text x="${(VW / 2).toFixed(1)}" y="${(oy - 34).toFixed(1)}" text-anchor="middle" font-size="11" fill="#8A8F92" ${M}>${fmt(L)} × ${fmt(W)} м</text>`);
  }
  // подписи проёмов (см); в редакторе — кнопка «⋯» у каждой межкомнатной двери
  for (const { d, lx, ly } of doorPx) {
    const txt = String(d.ext ? cm(d.w) : cm(d.w) - 9), sel = ed && opt.sel === d.i;
    if (ed) {
      const menu = !d.ext, wpx = Math.round(txt.length * 6.2 + (menu ? 11 : 0) + 9);
      p.push(`<g data-door="${d.i}"><rect x="${(lx - wpx / 2).toFixed(1)}" y="${(ly - 8).toFixed(1)}" width="${wpx}" height="16" rx="8" fill="${sel ? "#E07A2E" : "#FFFFFF"}" stroke="#E07A2E" stroke-width="1"/>` +
        `<text x="${lx.toFixed(1)}" y="${(ly + 3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="${sel ? "#FFFFFF" : "#B4672C"}" ${F}>${txt}${menu ? "⋯" : ""}</text></g>`);
    } else if (s >= 22) {
      p.push(`<text x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}" text-anchor="middle" font-size="7.5" font-weight="700" fill="#B4672C" ${F} paint-order="stroke" stroke="#FFFFFF" stroke-width="2.5">${txt}</text>`);
    }
  }
  if (ed) for (const { q, cx, cy, box } of winPx) {
    const sel = opt.sel === "w" + q.idx, txt = winName(q.key) + "⋯", wpx = Math.round(txt.length * 5.9 + 10);
    p.push(`<rect data-win="${q.idx}" x="${(box[0] - 5).toFixed(1)}" y="${(box[1] - 5).toFixed(1)}" width="${(box[2] + 10).toFixed(1)}" height="${(box[3] + 10).toFixed(1)}" fill="transparent"/>`);
    p.push(`<g data-win="${q.idx}"><rect x="${(cx - wpx / 2).toFixed(1)}" y="${(cy - 8).toFixed(1)}" width="${wpx}" height="16" rx="8" fill="${sel ? "#3F7FA6" : "#FFFFFF"}" stroke="#3F7FA6" stroke-width="1"/>` +
      `<text x="${cx.toFixed(1)}" y="${(cy + 3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${sel ? "#FFFFFF" : "#2F6488"}" ${F}>${txt}</text></g>`);
  }
  // в редакторе: невидимые зоны дверей (чтобы попасть пальцем), поверх — ручки стен
  if (ed) {
    for (const { d, box } of doorPx) p.push(`<rect data-door="${d.i}" x="${(box[0] - 4).toFixed(1)}" y="${(box[1] - 4).toFixed(1)}" width="${(box[2] + 8).toFixed(1)}" height="${(box[3] + 8).toFixed(1)}" fill="transparent"/>`);
    for (const q of lay.params.filter((x) => !x.hide)) {
      const hd = wallHandle(lay, q, L, W), act = opt.drag === q.k, off = 17;
      let hx = X(hd.x), hy = Y(hd.y);
      if (hd.side) { if (q.o === "v") hy += hd.side * off; else hx += hd.side * off; }
      const arr = q.o === "v" ? `M${hx - 6.5} ${hy} l4.5 -4 v8 z M${hx + 6.5} ${hy} l-4.5 -4 v8 z` : `M${hx} ${hy - 6.5} l-4 4.5 h8 z M${hx} ${hy + 6.5} l-4 -4.5 h8 z`;
      const stem = hd.side ? (q.o === "v" ? line(hx, hy - hd.side * 11, hx, Y(hd.y), "#E07A2E", 2) : line(hx - hd.side * 11, hy, X(hd.x), hy, "#E07A2E", 2)) : "";
      p.push(`<g data-wall="${q.k}">${stem}<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="22" fill="transparent"/><circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="${act ? 12.5 : 11}" fill="#E07A2E" stroke="#FFFFFF" stroke-width="2"/><path d="${arr}" fill="#FFFFFF"/></g>`);
  }
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Планировка дома">${p.join("")}</svg>`;
}

function bSummary(c) {
  const size = sizeOf(c), lay = layoutOf(c);
  const houseA = size.L * size.W, terA = terraceArea(c);
  const cl = lay.rooms.map((r) => clearOf(lay, r, size.L, size.W)), clearA = cl.reduce((t, q) => t + q.a, 0);
  const extras = EXTRAS.filter(([k]) => c[k] && !(k === "exit2" && exit2At(c) === null) && !(k === "porch" && c.terrace !== "none") && !(k === "aerator" && layoutOf(c).seam !== "h")).map(([, n]) => n);
  const terTxt = c.terrace === "along" ? `вдоль дома, ${fmt(terA / T_DEPTH)} м, ${fmt(terA)} м²`
    : c.terrace === "end" ? `${endSide(c) === "left" ? "слева" : "справа"}, на всю ширину дома, вход с террасы, ${fmt(terA)} м²` : "нет";
  const main = lay.rooms.map((r, i) => [r, cl[i]]).filter(([r]) => r.t === "bed" || r.t === "kl").sort((a, b) => (a[0].t === "kl") - (b[0].t === "kl"));
  const roomsTxt = main.map(([r, q]) => `${ROOM[r.t].n.toLowerCase()} ${fmt2(q.w)}×${fmt2(q.h)} м, ${fmt(q.a)} м²`).join("; ");
  // проёмы дверей: межкомнатные по ширине, наружные — отдельно
  const inner = {}, extN = lay.doors.filter((d) => d.ext).length + (exit2At(c) !== null ? 1 : 0);
  lay.doors.filter((d) => !d.ext).forEach((d) => { inner[cm(d.w) - 9] = (inner[cm(d.w) - 9] || 0) + 1; });
  const innerTxt = Object.keys(inner).sort().map((w) => `${w} см — ${inner[w]} шт.`).join(", ");
  const doorsTxt = `межкомнатные двери: ${innerTxt || "нет"} (проёмы на 9 см шире, высота ${cm(DOOR_H)}); наружные — проём ${cm(DOOR_EXT)} × ${cm(DOOR_H_EXT)} см — ${extN} шт.`;
  const rows = [
    ["Размер", `${size.name} м`],
    ["Площадь дома", `${fmt(houseA)} м², полезная ${fmt(clearA)} м²`],
    ["Размеры", gabTxt(c)],
    ["Терраса", terTxt],
    ["Планировка", lay.name],
    ["Комнаты", roomsTxt.charAt(0).toUpperCase() + roomsTxt.slice(1)],
    ["Двери", doorsTxt],
    ["Окна", winsTxt(c, lay)],
    ["Стены", colorName(WALLS, "wall", c)],
    ["Углы и окна", colorName(ACCENTS, "accent", c)],
    ["Внутри", colorName(INNER, "inner", c)],
    ["Дополнительно", extras.length ? extras.join(", ") : "нет"]
  ];
  const rooms = lay.rooms.map((r, i) => `${ROOM[r.t].n} ${fmt2(cl[i].w)}×${fmt2(cl[i].h)} м, ${fmt(cl[i].a)} м²`).join("; ");
  const text = "Мой модульный дом\n" + rows.map(([k, v]) => `${k}: ${v}`).join("\n") +
    `\nКомнаты: ${rooms}` + (terA ? `\nОбщая площадь с террасой: ${fmt(houseA + terA)} м²` : "");
  return { rows, text, houseA, terA, size, lay };
}

let bView = "facade";
let bBound = false;
function renderBuild() {
  current = null;

    <section class="b-group"><h2>Цвет стен</h2><div class="swatches">${sw("wall", WALLS, c.wall)}</div></section>

    <section class="b-group"><h2>Дополнительно</h2><div class="toggles">${EXTRAS.map(([k, n]) => `<label class="toggle"><input type="checkbox" data-x="${k}"${c[k] ? " checked" : ""}><span class="sw" aria-hidden="true"></span><span class="t">${esc(n)}</span></label>`).join("")}</div></section>
    </div>

      <button type="button" class="b-lead" id="b-lead">Оставить заявку на этот дом</button>
      <div class="b-actions">

  app.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => { bView = b.dataset.view; bUpdate(); }));
  if (!bBound) { app.addEventListener("click", bClick); bBound = true; }
  app.querySelectorAll("[data-x]").forEach((i) => i.addEventListener("change", () => { bcfg[i.dataset.x] = i.checked; bChanged(); }));
  document.getElementById("b-img").addEventListener("click", bImage);
  app.querySelectorAll(".sw-pick").forEach((inp) => {
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("input", () => {

      app.querySelectorAll(`.swatch[data-k="${k}"]`).forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === "custom")));
      bSave(); bUpdate();
    });
  });
  document.getElementById("b-lead").addEventListener("click", bLead);
  document.getElementById("b-share").addEventListener("click", bShare);
  document.getElementById("b-copy").addEventListener("click", bCopy);
  document.getElementById("b-mat").addEventListener("click", () => bToast("Расчёт материалов — в разработке"));
  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => go("#/"));

  document.getElementById("b-canvas").addEventListener("click", () => { if (bView === "plan") peOpen(); });

function bClick(e) {
  const b = e.target.closest("button[data-k]");
  if (!b || !location.hash.startsWith("#/build")) return;
  bcfg[b.dataset.k] = b.dataset.v;
  if (b.dataset.k === "size" && !B_LAYOUTS[bcfg.size].some((l) => l.id === bcfg.layout)) bcfg.layout = B_LAYOUTS[bcfg.size][0].id;
  if (["size", "layout", "terrace"].includes(b.dataset.k)) bControls();
  bChanged();
}
/* Ползунки: размер спален и длина террасы, переключатель стороны торцевой террасы */
function bControls() {
  const c = bcfg, L = sizeOf(c).L;
  const adjBox = document.getElementById("b-adj"), txBox = document.getElementById("b-tx");
  const { key } = variantOf(c), edited = !!(c.pv[key] || c.dpos[key] || c.dw[key] || c.win[key] || (c.spos && c.spos[key]) || (c.tsp && c.tsp[key]));
  adjBox.innerHTML = `<button type="button" class="ghost b-edit" id="b-edit">✎ Редактировать проект</button>

async function bImage() {

    const Wd = 1080, pad = 48, picH = Math.round(Wd * 210 / 360);

    const H = pad + 70 + (picH + 24) * 4 + 30 + lines.length * 46 + 14 * 40 + 90;

    const g = cv.getContext("2d");

    g.fillStyle = "#1D2125"; g.font = "600 44px Arial, sans-serif"; g.fillText("Мой модульный дом", pad, pad + 40);

    g.drawImage(pl, 0, y, Wd, picH); y += picH + 46;
    const vx = 380, maxW = Wd - vx - pad;
    const wrap = (txt) => {
      g.font = "600 30px Arial, sans-serif";
      const words = txt.split(" "), out = []; let cur = "";
      for (const w of words) { const t = cur ? cur + " " + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
      if (cur) out.push(cur); return out;
    };
    for (const [k, v] of lines) {
      g.font = "30px Arial, sans-serif"; g.fillStyle = "#6A7075"; g.fillText(k, pad, y);
      const ls = wrap(v); g.fillStyle = "#1D2125"; g.font = "600 30px Arial, sans-serif";
      ls.forEach((t, i) => g.fillText(t, vx, y + i * 40));
      y += 46 + (ls.length - 1) * 40;
    }
    g.fillStyle = "#8A9095"; g.font = "26px Arial, sans-serif";
    g.fillText("Изготовление от 2 до 5 недель «под ключ», установка — 1–2 дня", pad, y + 30);

function peOpen() {

  document.body.appendChild(ov);

  });

  cv.addEventListener("pointerdown", (e) => {
    const t = e.target.closest("[data-tend],[data-stove],[data-wall],[data-door],[data-win],[data-owall]");
    if (!t) { if (pe.sel !== null) { pe.sel = null; peRender(); } return; }
    e.preventDefault();
    const door = t.dataset.door != null ? (t.dataset.door === "x2" ? "x2" : +t.dataset.door) : null;
    pe.ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false, wall: t.dataset.wall || null, door,
      win: t.dataset.win != null ? +t.dataset.win : null, owall: t.dataset.owall || null, stove: t.dataset.stove != null, tend: t.dataset.tend != null ? +t.dataset.tend : null };

    else if (q.win !== null) pe.sel = "w" + q.win;

function peMeters(cx, cy) {

function peMoveWall(k, m) {
  const { v, key } = variantOf(bcfg), q = v.params.find((x) => x.k === k);

  let val = Math.round((q.o === "v" ? m.x : m.y) / 0.05) * 0.05;
  val = Math.max(valOf(q.min, p), Math.min(valOf(q.max, p), val));
  val = Math.round(val * 100) / 100;

      <figure class="done-photo${h.svg ? " is-svg" : ""}">${h.svg ? h.svg : `<img src="${src(h.cover || h.photos[0])}" alt="${esc(h.name)}">`}<span class="seal"><svg viewBox="0 0 60 60" aria-hidden="true"><path d="M15 31 26 42 46 19"/></svg></span></figure>
      <p class="done-name">${esc(h.name)}</p>
      <p>Это пробная версия: настоящей оплаты не было. В рабочей версии здесь будет заявка менеджеру.</p>
      <button class="ghost" type="button" id="to-catalog">Вернуться в каталог</button>
    </div></div>`;
  document.getElementById("to-catalog").addEventListener("click", () => go("#/"));
  confetti();
  if (inTG) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
  window.scrollTo(0, 0);
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div");
  box.className = "confetti";
  const colors = ["#B4672C", "#D88B4C", "#1D2125", "#6C8A6E", "#E9C9A6"];
  for (let i = 0; i < 46; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = 1.6 + Math.random() * 1.6 + "s";
    p.style.animationDelay = Math.random() * 0.5 + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4000);
}

/* Кнопка «Купить»: в Telegram — родная кнопка внизу, в браузере — своя */
let mainAction = null;
function onBuy() { if (mainAction) mainAction(); }
function setMain(text, fn) {
  mainAction = fn || null;
  if (inTG) {
    try {
      if (fn) { tg.MainButton.setText(text); tg.MainButton.show(); }
      else tg.MainButton.hide();
    } catch (e) {}
    buybar.hidden = true;
  } else {
    buybar.hidden = !fn;
    if (fn) document.getElementById("buy").textContent = text;
  }
}
function setBuy(show) { setMain("Купить", show ? () => { if (current) go("#/done/" + current.id); } : null); }
document.getElementById("buy").addEventListener("click", onBuy);
if (inTG) { try { tg.MainButton.onClick(onBuy); tg.BackButton.onClick(() => { if (!viewer.hidden) closeViewer(); else if (pe) peClose(); else go("#/"); }); } catch (e) {} }

/* Просмотр фото на весь экран */
const viewer = document.getElementById("viewer");
function openViewer(key) { openViewerUrl(src(key), ""); }
function openViewerUrl(url, hint) {
  viewer.classList.remove("is-gallery"); document.getElementById("viewer-strip").hidden = true; document.getElementById("viewer-count").hidden = true;
  document.getElementById("viewer-img").src = url;
  const h = document.getElementById("viewer-hint");
  h.textContent = hint || ""; h.hidden = !hint;
  viewer.hidden = false;
  if (ovKind !== "viewer") ovPush("viewer");
}
let vIndex = 0, vOnClose = null;
function closeViewer(fromHistory) {
  if (viewer.hidden) return;
  if (!fromHistory && ovKind === "viewer") ovPop();
  viewer.hidden = true;
  if (viewer.classList.contains("is-gallery")) {
    viewer.classList.remove("is-gallery");
    const strip = document.getElementById("viewer-strip"); strip.hidden = true; strip.onscroll = null; strip.innerHTML = "";
    document.getElementById("viewer-count").hidden = true;
    if (vOnClose) { const f = vOnClose; vOnClose = null; try { f(vIndex); } catch (e) {} }
  }
}
/* Фото дома на весь экран: листаются вправо-влево, подпись и счётчик меняются вместе с фото */
function openGallery(keys, caps, start, onClose) {
  const strip = document.getElementById("viewer-strip"), hint = document.getElementById("viewer-hint"), count = document.getElementById("viewer-count");
  caps = caps || []; vIndex = start || 0; vOnClose = onClose || null;
  strip.innerHTML = keys.map((k, i) => `<figure class="vslide"><img src="${src(k)}" alt="${esc(caps[i] || "")}"${Math.abs(i - vIndex) > 1 ? ' loading="lazy"' : ""} decoding="async"></figure>`).join("");
  const upd = () => { hint.textContent = caps[vIndex] || ""; hint.hidden = !caps[vIndex]; count.textContent = (vIndex + 1) + " / " + keys.length; document.getElementById("viewer-prev").disabled = vIndex <= 0; document.getElementById("viewer-next").disabled = vIndex >= keys.length - 1; };
  viewer.classList.add("is-gallery"); strip.hidden = false; count.hidden = false; viewer.hidden = false;
  if (ovKind !== "viewer") ovPush("viewer");
  upd();
  requestAnimationFrame(() => { strip.scrollLeft = strip.clientWidth * vIndex; });
  let raf = 0;
  strip.onscroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const i = Math.round(strip.scrollLeft / strip.clientWidth); if (i !== vIndex && i >= 0 && i < keys.length) { vIndex = i; upd(); } }); };
}
viewer.addEventListener("click", (e) => { const nb = e.target.closest(".viewer-nav"); if (nb) { const st = document.getElementById("viewer-strip"); st.scrollBy({ left: (nb.id === "viewer-next" ? 1 : -1) * st.clientWidth, behavior: "smooth" }); return; } if (e.target.closest("#viewer-close")) { closeViewer(); return; } if (!viewer.classList.contains("is-gallery")) closeViewer(); });
document.addEventListener("keydown", (e) => {
  if (viewer.hidden || !viewer.classList.contains("is-gallery")) return;
  const strip = document.getElementById("viewer-strip");
  if (e.key === "ArrowRight") strip.scrollBy({ left: strip.clientWidth, behavior: "smooth" });
  if (e.key === "ArrowLeft") strip.scrollBy({ left: -strip.clientWidth, behavior: "smooth" });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeViewer(); });

/* Окна поверх страницы — свой шаг в истории: «Назад» закрывает окно, страница остаётся */
var ovKind = null;
function ovPush(kind) { try { history.pushState({ ov: kind }, "", location.href); ovKind = kind; } catch (e) { ovKind = null; } }
function ovPop() { if (!ovKind) return; ovKind = null; try { history.back(); } catch (e) {} }
window.addEventListener("popstate", () => { if (!ovKind) return; const k = ovKind; ovKind = null; if (k === "pe" && pe) peClose(true); else if (k === "viewer" && !viewer.hidden) closeViewer(true); });
/* Навигация */
/* Фон по бокам на широком экране: каталог — дом в середине экрана, страница дома — этот дом, конструктор — без фото */
const amb = document.getElementById("amb"), ambImgs = amb ? amb.querySelectorAll("img") : [];
let ambCur = null, ambI = 0, ambRaf = 0;
function ambSet(url) {
  if (!amb || url === ambCur) return;
  ambCur = url;
  if (!url) { ambImgs.forEach((im) => im.classList.remove("on")); return; }
  const next = ambImgs[ambI ^ 1], prev = ambImgs[ambI];
  next.onload = () => { if (next.getAttribute("src") !== ambCur) return; next.classList.add("on"); prev.classList.remove("on"); ambI ^= 1; };
  next.src = url;
}
function ambCheck() {
  ambRaf = 0;
  if (!amb || !matchMedia("(min-width: 700px)").matches) return;
  const m = location.hash.match(/^#\/house\/([\w-]+)/);
  if (m) { const h = HOUSES.find((x) => x.id === m[1]); ambSet(h ? src(h.cover || h.photos[0]) : ""); return; }
  if (location.hash.startsWith("#/build") || location.hash.startsWith("#/done")) { ambSet(""); return; }
  let best = null, bd = 1e9; const mid = innerHeight / 2;
  app.querySelectorAll(".list > .card").forEach((c) => { const r = c.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return; const d = Math.abs(r.top + r.height / 2 - mid); if (d < bd) { bd = d; best = c; } });
  const im = best && best.querySelector(".card-photo img");
  ambSet(im ? im.getAttribute("src") : (app.querySelector(".list > .card .card-photo img") || { getAttribute: () => "" }).getAttribute("src"));
}
const ambQueue = () => { if (!ambRaf) ambRaf = requestAnimationFrame(ambCheck); };
addEventListener("scroll", ambQueue, { passive: true });
addEventListener("resize", ambQueue);
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  if (ovKind === "viewer") ovKind = null;
  closeViewer(true);
  let m = location.hash.match(/^#\/(house|done)\/([\w-]+)/);
  if (m && ALIASES[m[2]]) { try { history.replaceState(null, "", "#/" + m[1] + "/" + ALIASES[m[2]]); } catch (e) {} m = location.hash.match(/^#\/(house|done)\/([\w-]+)/); }
  const h = m && (m[1] === "done" && m[2] === "my" ? { id: "my", name: `${sizeOf(bcfg).name}, ${layoutOf(bcfg).name.toLowerCase()}`, svg: facadeSVG(bcfg) } : HOUSES.find((x) => x.id === m[2]));
  const isBuild = location.hash === "#/build";
  if (inTG) { try { (h || isBuild ? tg.BackButton.show() : tg.BackButton.hide()); } catch (e) {} }
  if (isBuild) renderBuild();
  else if (h && m[1] === "house") renderHouse(h);
  else if (h && m[1] === "done") renderDone(h);
  else renderCatalog();
  ambQueue();
}
window.addEventListener("hashchange", route);
route();
cloudLoad();
</script>

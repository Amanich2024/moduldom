<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Загородная студия</title>
<style>body{margin:0;min-height:100svh;display:grid;place-content:center;background:#f5f1ea;color:#262820;font:18px system-ui,sans-serif}a{color:inherit}</style>
<script src="./telegram-web-app.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const app = window.Telegram && window.Telegram.WebApp;
  const inMiniApp = !!(app && app.initData && app.platform !== "unknown");
  const hash = location.hash;
  const projectLink = /^#(?:d\/|b\/|built$|katalog$)/.test(hash);
  const wideScreen = matchMedia("(min-width: 900px)").matches;
  const page = inMiniApp ? "katalog/" :
    (wideScreen && !projectLink ? "desktop-preview.html" : "katalog/preview.html");
  const destination = new URL(page, location.href);
  destination.search = location.search;
  if (projectLink) destination.hash = hash;
  location.replace(destination.href);
});
</script>
</head>
<body><p>Открываем «Загородную студию»…</p>
<noscript><p><a href="./katalog/preview.html">Открыть каталог домов</a></p></noscript>
</body></html>
